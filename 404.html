<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#1E3265">
<title>Page introuvable — CLUB 151</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<!-- Page autonome : mêmes couleurs, polices et traits fins que le reste du site
     (tokens/colors.css), recopiés ici pour qu'elle s'affiche même si rien d'autre
     ne se charge. Liens en chemins absolus : une adresse introuvable peut être
     n'importe où dans l'arborescence. -->
<style>
  :root { --ink:#15224F; --ink-2:#586089; --muted:#626A88; --paper:#FFFFFF; --paper-2:#F4F5F8;
    --line:#D9DDE8; --line-strong:#AEB5C8; --accent:#3363A9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
    font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  header { border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex; justify-content: center; }
  header img { height: 34px; width: auto; display: block; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { width: 100%; max-width: 560px; border: 1px solid var(--line); border-radius: 14px; padding: 44px 36px 40px; text-align: center; }
  .code { font-family: 'Poppins', 'Hanken Grotesk', system-ui, sans-serif; font-weight: 300; font-size: clamp(72px, 20vw, 128px);
    line-height: 1; letter-spacing: -0.03em; margin: 0; color: var(--ink); }
  h1 { font-family: 'Poppins', 'Hanken Grotesk', system-ui, sans-serif; font-weight: 400; font-size: 24px; line-height: 1.25; margin: 18px 0 10px; }
  p { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin: 0 auto 28px; max-width: 42ch; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { text-decoration: none; font-weight: 600; font-size: 15px; line-height: 1; padding: 15px 22px; border-radius: 8px;
    border: 1px solid var(--ink); transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  a.primary { background: var(--ink); color: #fff; }
  a.primary:hover { background: var(--accent); border-color: var(--accent); }
  a.outline { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  a.outline:hover { border-color: var(--ink); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  footer { border-top: 1px solid var(--line); padding: 16px 24px; text-align: center; font-size: 13.5px; color: var(--muted); }
  footer a { color: var(--ink); }
  @media (max-width: 480px) { .card { padding: 34px 22px 30px; } a.btn { flex: 1 1 100%; text-align: center; } }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
</head>
<body>
  <header>
    <a href="/" aria-label="CLUB 151 — retour à l'accueil"><img src="/assets/brand/logo-club151-horizontal.svg" alt="CLUB 151" width="97" height="34"></a>
  </header>
  <main>
    <div class="card">
      <p class="code" aria-hidden="true">404</p>
      <h1>Cette page est introuvable</h1>
      <p>Le lien est peut-être ancien, ou l'article n'est plus en vente. Le reste de la boutique est à deux pas.</p>
      <div class="btns">
        <a class="btn primary" href="/">Retour à l'accueil</a>
        <a class="btn outline" href="/boutique.html">Voir la boutique</a>
      </div>
    </div>
  </main>
  <footer>CLUB 151, 28 rue Juiverie, 38200 Vienne. Téléphone : <a href="tel:+33658988116">06 58 98 81 16</a></footer>
</body>
</html>
